
  <div class="task-card">
    @for (task of taskList; track task.id){
      @if (isSameUser(task.userId)) {
        <h3>{{task.title}}</h3>
        <p class="task-date">{{task.dueDate}}</p>
        <p class="task-description">{{task.summary}}</p>
        <div class="task-actions">
          <button class="complete-btn">Complete</button>
        </div>
      }
    }
  </div>
